  <meta name="description" content="Pobierz Hyc! z App Store na iPhone’a albo z Google Play na Androida.">

  <meta property="og:site_name" content="Hyc!">
  <meta property="og:title" content="Pobierz Hyc!">
  <meta property="og:description" content="Pobierz Hyc! z App Store na iPhone’a albo z Google Play na Androida.">
  <meta property="og:image" content="https://gethyc.com/assets/og-image.jpg?v=20261110">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="theme-color" content="#F0EBE0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <meta name="robots" content="noindex">

  <link rel="preload" href="assets/fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261107">
</head>
<body class="page-pobierz">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="./" class="topbar-logo" aria-label="Hyc!, strona główna">
        <img src="assets/logo-69.png?v=2" srcset="assets/logo-69.png?v=2 1x, assets/logo-138.png?v=2 2x, assets/logo-207.png?v=2 3x" alt="Hyc!" width="69" height="32">
      </a>
      <nav class="topbar-nav" aria-label="Główna nawigacja">
        <a href="o-aplikacji.html">O aplikacji</a>
        <a href="./#faq">FAQ</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>

      <!-- Ta strona JEST celem CTA z nawigacji, więc drugiego "Pobierz za
           darmo" tu nie ma — ale na ≥768px `justify-content: space-between`
           w .topbar-inner liczy odstępy logo<->nav / nav<->trzeci-element
           z SZEROKOŚCI trzech dzieci. Bez trzeciego dziecka nav przesunąłby
           się w stronę prawej krawędzi (inne miejsce niż na index.html).
           Niewidzialny placeholder o IDENTYCZNYCH klasach/tekście zajmuje
           dokładnie tyle samo miejsca co prawdziwy button na desktopie.
           Na <768px oba (realny button na innych stronach I ten placeholder)
           znikają razem przez `.topbar-inner .store-btn--nav{display:none}`
           — mobilny topbar to wtedy wszędzie po prostu logo+hamburger. -->
      <button type="button" class="topbar-burger" aria-expanded="false" aria-controls="mobile-nav" aria-label="Otwórz menu">
        <svg class="icon-menu" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M2.797 18.293V16.018H21.203V18.293ZM2.797 13.138V10.862H21.203V13.138ZM2.797 7.982V5.707H21.203V7.982Z"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M6.4 19.191L4.809 17.6L10.409 12.0L4.809 6.4L6.4 4.809L12.0 10.409L17.6 4.809L19.191 6.4L13.591 12.0L19.191 17.6L17.6 19.191L12.0 13.591Z"/></svg>
      </button>

      <span class="store-btn store-btn--primary store-btn--nav" aria-hidden="true" style="visibility:hidden">Pobierz</span>
    </div>
    <div class="nav-backdrop" aria-hidden="true"></div>
    <nav class="topbar-nav-mobile" id="mobile-nav" aria-label="Główna nawigacja (mobile)" hidden>
      <a href="o-aplikacji.html"><span>O aplikacji</span><svg class="nav-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
      <a href="./#faq"><span>FAQ</span><svg class="nav-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
      <a href="kontakt.html"><span>Kontakt</span><svg class="nav-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </nav>
  </header>

  <div class="wrap">
    <main>
      <!-- Te same batony co pod hero na stronie głównej, kopia zamiast
           odsyłacza do #stores, bo ta strona jest celem nav-CTA i adresem QR
           (?qr=1), nie skrótem z powrotem na hero. -->
      <section class="pobierz-hero">
        <h1>Pobierz Hyc!</h1>
        <p class="hero-tags">Wybierz odpowiedni sklep albo zeskanuj kod aparatem telefonu.</p>

        <div class="stores" id="stores">
          <a class="store-btn store-btn--dark store-btn--compact" id="btn-ios-open" href="https://apps.apple.com/pl/app/hyc-mapy-dla-w%C4%99drowc%C3%B3w/id6793204849" rel="noopener" data-goatcounter-click="pobierz-appstore">
            <img src="assets/apple.svg" alt="">
            <span class="label"><small>Pobierz z</small><strong>App Store</strong></span>
          </a>

          <a class="store-btn store-btn--dark store-btn--compact" id="btn-android-open" href="https://play.google.com/store/apps/details?id=pl.hycdobudy.hyc_do_budy" rel="noopener" data-goatcounter-click="pobierz-play">
            <img src="assets/google.svg" alt="">
            <span class="label"><small>Pobierz z</small><strong>Google Play</strong></span>
          </a>
        </div>

        <!-- Ten sam kod co w hero, patrz komentarz w index.html. -->
        <div class="qr-card" hidden>
          <p>Zeskanuj i pobierz</p>
          <img data-src="assets/qr-pobierz.svg" alt="Kod QR prowadzący do pobrania aplikacji Hyc!" width="180" height="180">
        </div>
      </section>
    </main>

    <footer id="kontakt">
      <span>© <span id="year">2026</span> <strong>Hyc!</strong></span>
      <span class="spacer"></span>
      <a href="legal/privacy.html">Prywatność</a>
      <a href="legal/eula.html">Regulamin</a>
      <a href="legal/warunki_bezpiecznego_korzystania.html">Bezpieczeństwo</a>
      <a href="kontakt.html">Kontakt</a>
    </footer>
  </div>

  <script src="config.js?v=20261107"></script>
  <script src="nav.js?v=20261008" defer></script>
  <script data-goatcounter="https://dinin92.goatcounter.com/count" async src="assets/goatcounter-count.js?v=2"></script>
  <script src="main.js?v=20261107"></script>
</body>
</html>
